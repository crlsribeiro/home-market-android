# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated:
      - Composable
    ignoreDefaultParameters: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  MaxLineLength:
    maxLineLength: 120
